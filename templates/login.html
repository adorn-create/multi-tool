<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Kali AI Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">K</div>
    <p class="eyebrow">PRIVATE WORKSPACE</p>
    <h1>Welcome back</h1>
    <p class="muted">Enter the site password to continue.</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="primary-button full-width" type="submit">Enter workspace <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-footnote">Only people you share the password with can sign in.</p>
  </main>
</body>
</html>
